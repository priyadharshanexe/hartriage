[project]
name = "hartriage"
version = "0.1.0"
description = "Redact HAR files before they are stored, find the failing request and write a ticket-ready summary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.3",
    "celery[redis]>=5.7.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.0",
    "structlog>=26.1.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
hartriage = "hartriage.cli.main:app"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.3",
    "hypothesis>=6.170.15",
    "moto[s3]>=5.2.5",
    "mypy>=2.4.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-recording>=0.14.1",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "vcrpy>=9.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hartriage"]

[tool.hatch.build.targets.wheel.force-include]
"kb" = "hartriage/_kb"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend", "casebook"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear
  "UP",       # pyupgrade
  "N",        # naming
  "S",        # bandit (security)
  "SIM",      # simplify
  "PT",       # pytest style
  "RUF",      # ruff-specific
]
ignore = [
  "E501",    # the formatter wraps code; long user-facing sentences stay readable as one string
  "RUF001",  # arrows, multiplication signs and curly quotes are intended in findings
  "N818",    # InputTooLarge reads better than InputTooLargeError
  "B008",    # frozen dataclass defaults such as Limits() are immutable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT018", "RUF043", "PT012", "PT022"]  # asserts, fake secrets, non-crypto randomness
"tools/**" = ["S101", "S105", "S106", "S311", "S104"]
"hartriage/db/migrations/versions/*" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.13"
files = ["hartriage", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ijson.*", "celery.*", "kombu.*", "vcr.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hartriage.worker.tasks", "hartriage.helpdesk.tasks", "hartriage.worker.celery_app"]
disallow_untyped_decorators = false  # Celery ships without type information

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs PostgreSQL and Redis (docker compose up -d postgres redis)",
  "slow: the memory ceiling test on a generated 50 MB HAR",
  "live_helpdesk: talks to a real Zendesk or Freshdesk trial (opt-in, records cassettes)",
]
