name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hartriage
          POSTGRES_PASSWORD: hartriage
          POSTGRES_DB: hartriage
        ports: ["5436:5432"]  # same host port as docker-compose.yml
        options: >-
          --health-cmd "pg_isready -U hartriage -d hartriage"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      HYPOTHESIS_PROFILE: ci  # thousands of generated files for the redaction property test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (unit, property, golden, integration, helpdesk)
        run: uv run pytest

  frontend:
    name: Frontend - types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end - browser flow
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the whole stack
        run: docker compose up --build --wait --wait-timeout 300 postgres redis s3 api worker web fake-helpdesk
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Upload, findings, copy for ticket, request detail
        working-directory: frontend
        run: npx playwright test
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail 200

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # a secret removed in a later commit is still leaked
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the whole history
        run: gitleaks git --redact --verbose .

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API, worker and fake helpdesk image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hartriage:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: The image runs the CLI on a sample file
        run: |
          docker run --rm -v "$PWD/tools/fixtures/samples:/samples:ro" --entrypoint hartriage hartriage:ci \
            analyze /samples/checkout-broken.har --format text
      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: hartriage-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
