# Local stack: `docker compose up --build`
#
#   Web app        http://localhost:8280
#   API            http://localhost:8200   (OpenAPI docs at /docs)
#   Fake helpdesk  http://localhost:8290   (Zendesk + Freshdesk stand-in for demos)
#   Object storage http://localhost:9200   (RustFS, S3-compatible; console on 9201)
#   Postgres       localhost:5436  user/password/db: hartriage
#   Redis          localhost:6380
#
# Host ports are chosen to sit next to other local stacks without clashing.

name: hartriage

x-app: &app
  build: .
  restart: unless-stopped
  environment: &env
    HARTRIAGE_ENVIRONMENT: development
    HARTRIAGE_DATABASE_URL: postgresql+psycopg://hartriage:hartriage@postgres:5432/hartriage
    HARTRIAGE_REDIS_URL: redis://redis:6379/0
    HARTRIAGE_S3_ENDPOINT_URL: http://s3:9000
    HARTRIAGE_S3_ACCESS_KEY: hartriage
    HARTRIAGE_S3_SECRET_KEY: hartriage-dev-secret
    HARTRIAGE_PUBLIC_URL: http://localhost:8280
    HARTRIAGE_API_PUBLIC_URL: http://localhost:8200
    HARTRIAGE_ALLOWED_ORIGINS: '["http://localhost:8280","http://localhost:5173"]'
    HARTRIAGE_LOG_JSON: "true"
    # Point the Zendesk and Freshdesk clients at the fake helpdesk below.
    # Remove this line to talk to real trial accounts.
    HARTRIAGE_HELPDESK_BASE_URL_OVERRIDE: http://fake-helpdesk:8290
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hartriage
      POSTGRES_PASSWORD: hartriage
      POSTGRES_DB: hartriage
    ports:
      - "${HARTRIAGE_POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hartriage -d hartriage"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # a queue, not a database
    ports:
      - "${HARTRIAGE_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage. (MinIO's official image is no longer published.)
  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: hartriage
      RUSTFS_SECRET_KEY: hartriage-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${HARTRIAGE_S3_HOST_PORT:-9200}:9000"
      - "127.0.0.1:9201:9001"
    volumes:
      - s3data:/data

  migrate:
    <<: *app
    command: ["python", "-m", "hartriage.db.migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8200:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "hartriage.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *env
      PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
    healthcheck:
      disable: true
    stop_grace_period: 30s

  beat:
    <<: *app
    command: ["celery", "-A", "hartriage.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8280:80"
    depends_on:
      api:
        condition: service_healthy

  # A stand-in for Zendesk and Freshdesk, so the tag → private note flow can be
  # demonstrated and tested without a trial account. See tools/fake_helpdesk.
  fake-helpdesk:
    build: .
    command: ["uvicorn", "tools.fake_helpdesk.app:app", "--host", "0.0.0.0", "--port", "8290"]
    working_dir: /app
    environment:
      FAKE_HELPDESK_WEBHOOK_BASE: http://api:8000
    ports:
      - "8290:8290"
    healthcheck:
      disable: true

volumes:
  pgdata:
  s3data:
