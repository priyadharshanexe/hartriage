# Render Blueprint: the public HAR Triage demo on Render's free tier.
# Postgres comes from Neon, Redis from Upstash and file storage from Supabase
# Storage (S3-compatible). All three are free with no card; paste their details
# when Render asks for the values marked sync: false.
services:
  - type: web
    name: hartriage
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HARTRIAGE_ENVIRONMENT
        value: production
      - key: HARTRIAGE_DATABASE_URL    # postgresql+psycopg://USER:PASSWORD@HOST/DB?sslmode=require (Neon)
        sync: false
      - key: HARTRIAGE_REDIS_URL       # rediss://default:PASSWORD@HOST:6379 (Upstash)
        sync: false
      - key: HARTRIAGE_JWT_SECRET
        generateValue: true
      - key: HARTRIAGE_ENCRYPTION_KEY  # base64 of 32 random bytes
        sync: false
      - key: HARTRIAGE_DATABASE_POOL_SIZE
        value: "3"
      - key: HARTRIAGE_CELERY_EAGER    # analyse inside the API; no separate worker
        value: "true"
      - key: HARTRIAGE_FRESHDESK_POLL_SECONDS
        value: "0"
      - key: HARTRIAGE_PUBLIC_URL      # https://<your-service>.onrender.com
        sync: false
      - key: HARTRIAGE_API_PUBLIC_URL  # the same address
        sync: false
      - key: HARTRIAGE_ALLOWED_ORIGINS # ["https://<your-service>.onrender.com"]
        sync: false
      - key: HARTRIAGE_S3_ENDPOINT_URL # https://<project>.supabase.co/storage/v1/s3
        sync: false
      - key: HARTRIAGE_S3_REGION       # Supabase project region, e.g. ap-south-1
        sync: false
      - key: HARTRIAGE_S3_ACCESS_KEY
        sync: false
      - key: HARTRIAGE_S3_SECRET_KEY
        sync: false
      - key: HARTRIAGE_S3_BUCKET
        value: hartriage
      - key: HARTRIAGE_S3_LIFECYCLE    # Supabase Storage has no lifecycle rules
        value: "false"
      - key: HARTRIAGE_LOG_JSON
        value: "true"
